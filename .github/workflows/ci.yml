name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Src/RimBob.sln

      - name: Build
        run: dotnet build Src/RimBob.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Src/Tests/RimBob.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Host smoke test (/api/health)
        run: |
          dotnet run --project Src/ApiHost/RimBob.Host.csproj --configuration Release --no-build > host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Health endpoint responded after ${i}s"
              kill $HOST_PID 2>/dev/null || true
              wait $HOST_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Host did not respond within 30s — log follows:"
          cat host.log
          kill $HOST_PID 2>/dev/null || true
          exit 1

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install
        working-directory: Dashboard
        run: npm ci

      - name: Build
        working-directory: Dashboard
        run: npm run build
