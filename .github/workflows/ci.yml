name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore RimAI.sln

      - name: Build
        run: dotnet build RimAI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/RimAI.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install
        working-directory: Dashboard
        run: npm ci

      - name: Build
        working-directory: Dashboard
        run: npm run build
